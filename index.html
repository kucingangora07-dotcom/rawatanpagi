<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rawatan Pagi - FKKP</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <!-- ================= HALAMAN 1: BERANDA UTAMA ================= -->
        <div id="halamanUtama">
            <div class="header">
                <h1>Rawatan Pagi</h1>
                <h2>FKKP</h2>
                <div class="date-badge" id="tampilTanggal">Hari ini: -</div>
            </div>

            <div class="content">
                <!-- Tombol 1: Baca Penyegaran Pagi -->
                <button class="btn btn-green" id="btn-baca">
                    <span class="btn-icon">📖</span>
                    <span>Baca Penyegaran Pagi</span>
                </button>

                <!-- Tombol 2: Dengar Suara -->
                <button class="btn btn-orange" id="btn-audio">
                    <span class="btn-icon">🎧</span>
                    <span>Dengar Suara</span>
                </button>

                <!-- Tombol 3: Lihat Video -->
                <button class="btn btn-blue" id="btn-video">
                    <span class="btn-icon">📹</span>
                    <span>Lihat Video</span>
                </button>

                <!-- Tombol 4: Link Mingguan / Pilihan Hari -->
                <button class="btn btn-purple" onclick="bukaTampilanPilihHari()">
                    <span class="btn-icon">📚</span>
                    <span>Link Mingguan</span>
                </button>

                <!-- Konten Pembacaan / Media Langsung di Beranda -->
                <div id="media-preview" class="media-preview hidden">
                    <div id="audio-box" class="media-card hidden">
                        <audio id="audio-player" controls style="width: 100%; margin-top: 10px;"></audio>
                    </div>
                    <div id="video-box" class="media-card hidden">
                        <video id="video-player" controls playsinline style="width: 100%; margin-top: 10px;"></video>
                    </div>
                    <div id="text-box" class="media-card hidden" style="background: white; padding: 15px; border-radius: 8px; margin-top: 10px; text-align: left; color: #333;">
                        <div id="renungan-body"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= HALAMAN 2: PILIH HARI ================= -->
        <div id="halamanPilihHari" class="hidden">
            <div class="header" style="height: 180px;">
                <h1>Pilih Hari</h1>
                <div class="date-badge" id="tampilMingguKe" style="margin-top: 10px;">Minggu 1</div>
            </div>

            <div class="content">
                <!-- 0. Garis Besar Minggu Ini -->
                <button class="btn btn-brown" onclick="pilihHariDanKembali(0)">
                    <span class="btn-icon">0</span>
                    <span>Garis Besar Minggu ini</span>
                </button>

                <!-- Hari 1 - 6 -->
                <button class="btn btn-brown" onclick="pilihHariDanKembali(1)">
                    <span class="btn-icon">1</span>
                    <span>Hari 1 - Senin</span>
                </button>

                <button class="btn btn-green" onclick="pilihHariDanKembali(2)">
                    <span class="btn-icon">2</span>
                    <span>Hari 2 - Selasa</span>
                </button>

                <button class="btn btn-blue" onclick="pilihHariDanKembali(3)">
                    <span class="btn-icon">3</span>
                    <span>Hari 3 - Rabu</span>
                </button>

                <button class="btn btn-purple" onclick="pilihHariDanKembali(4)">
                    <span class="btn-icon">4</span>
                    <span>Hari 4 - Kamis</span>
                </button>

                <button class="btn btn-orange" onclick="pilihHariDanKembali(5)">
                    <span class="btn-icon">5</span>
                    <span>Hari 5 - Jumat</span>
                </button>

                <button class="btn btn-teal" onclick="pilihHariDanKembali(6)">
                    <span class="btn-icon">6</span>
                    <span>Hari 6 - Sabtu</span>
                </button>

                <!-- Tombol Kembali -->
                <button class="btn btn-back" onclick="bukaHalamanUtama()">
                    Kembali ke Beranda
                </button>
            </div>
        </div>

        <div class="footer">
            FKKP - Rawatan Pagi
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
